name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    # A hanging (e.g. deadlocked) test should fail quickly instead of after 6 hours.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run CI
        run: zig build ci -Doptimize=${{ matrix.optimize }} --summary all

  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # A new seed for every run (and re-run) explores new inputs. The run is
      # not exactly reproducible from the seed (the fuzzer schedules the fuzz
      # tests by CPU time), so the failing input is uploaded instead; adding
      # it to the test's corpus replays it on every `zig build test`.
      # `zig build test --fuzz` exits with code 0 even when it finds a failing
      # input, so check for the saved input explicitly. --fuzz is not
      # supported on Windows. The LLVM backend is required for the coverage
      # instrumentation the fuzzer needs (the self-hosted x86_64 backend
      # produces none).
      - name: Fuzz
        id: fuzz
        shell: bash
        run: |
          seed=$(( (${{ github.run_id }} * 31 + ${{ github.run_attempt }}) % 4294967296 ))
          echo "Fuzzing with --seed=$seed"
          rm -rf .zig-cache/f
          zig build test --fuzz=30K --seed=$seed -Duse-llvm --summary all
          if [ -e .zig-cache/f/crash ]; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Fuzzing found a failing input (see the output above for the test). Download the fuzz-crash artifact and add it to that test's corpus to reproduce it."
            exit 1
          fi

      - name: Upload failing input
        if: failure() && steps.fuzz.outputs.crashed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: .zig-cache/f/crash
